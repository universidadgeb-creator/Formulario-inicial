<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encuesta de Bienvenida — Vivo 47 Center</title>
<meta name="description" content="Formulario inicial para nuevos socios de Vivo 47 Center.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
:root{
  --bg:#FAFAF9;
  --surface:#FFFFFF;
  --ink:#101208;
  --ink-soft:#3A3D31;
  --muted:#6E7160;
  --line:#E6E5DC;
  --accent:#DBFC8B;
  --accent-ink:#141C08;
  --danger:#B3452E;
  --chip-bg:#12140B;
  --chip-fg:#F5F6EE;
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101108;
    --surface:#17190E;
    --ink:#F4F5EC;
    --ink-soft:#D3D5C4;
    --muted:#9A9E86;
    --line:#2B2E1E;
    --accent:#DBFC8B;
    --accent-ink:#101108;
  }
}
:root[data-theme="dark"]{
  --bg:#101108;
  --surface:#17190E;
  --ink:#F4F5EC;
  --ink-soft:#D3D5C4;
  --muted:#9A9E86;
  --line:#2B2E1E;
  --accent:#DBFC8B;
  --accent-ink:#101108;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Unbounded",ui-sans-serif,system-ui,sans-serif;text-wrap:balance;margin:0;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
button{font-family:inherit;}
::selection{background:var(--accent);color:var(--accent-ink);}

.app{
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:0 20px calc(40px + env(safe-area-inset-bottom));
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));
}
@media (min-width:520px){
  .app{ padding-left:24px; padding-right:24px; }
}

/* ---- top bar ---- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 0 16px;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:50%;
  background:var(--ink);color:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-family:"Unbounded";font-weight:700;font-size:13px;
  flex:none;
}
.brand-name{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);}
.step-count{font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}

.progress-track{
  height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:8px;
}
.progress-fill{
  height:100%;background:var(--ink);border-radius:4px;
  transition:width .45s cubic-bezier(.65,0,.35,1);
}

.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:28px 0 8px;
}

.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}

.q-title{font-size:clamp(24px,4.4vw,34px);font-weight:700;line-height:1.16;margin-bottom:8px;}
.q-sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:26px;max-width:52ch;}

.field{margin-bottom:22px;}
input[type=text], input[type=tel], input[type=date], input[type=password], textarea{
  width:100%;
  font-family:"Archivo",sans-serif;
  font-size:19px;
  font-weight:500;
  color:var(--ink);
  background:transparent;
  border:none;
  border-bottom:2px solid var(--line);
  padding:10px 2px 12px;
  outline:none;
  transition:border-color .2s;
}
input::placeholder, textarea::placeholder{color:var(--muted);font-weight:400;}
input:focus, textarea:focus{border-bottom-color:var(--ink);}
textarea{resize:vertical;min-height:110px;line-height:1.5;font-size:17px;}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;}

.phone-row{display:flex;gap:14px;}
.phone-row input.lada{width:66px;flex:none;text-align:center;}
.phone-row input.num{flex:1;}

.options{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:center;gap:14px;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:15px 18px;
  cursor:pointer;
  background:var(--surface);
  transition:border-color .15s, background .15s, transform .1s;
  font-size:15.5px;
  font-weight:600;
  color:var(--ink-soft);
  user-select:none;
}
.opt:hover{border-color:var(--ink-soft);}
.opt .badge{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
  flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;transition:all .15s;
}
.opt.multi .badge{border-radius:6px;}
.opt.single .badge{border-radius:50%;}
.opt.selected{border-color:var(--ink);background:var(--accent);color:var(--accent-ink);}
.opt.selected .badge{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent);}

.chipwrap{display:flex;flex-wrap:wrap;gap:9px;}
.chip{
  border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;
  font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;background:var(--surface);
  transition:all .15s;
  min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;
}
.chip.selected{background:var(--ink);border-color:var(--ink);color:var(--bg);}

.subblock{margin-bottom:24px;}
.subblock-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;}

/* nav buttons */
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:8px;padding-top:18px;}
.btn{
  border:none;border-radius:999px;padding:15px 26px;font-size:15px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s, opacity .12s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--bg);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--muted);padding:15px 8px;}
.btn-ghost:hover{color:var(--ink);}

/* intro / outro */
.hero{
  display:flex;flex-direction:column;justify-content:center;flex:1;padding:40px 0;
}
.hero .kicker{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--chip-bg);color:var(--chip-fg);
  font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;margin-bottom:22px;width:fit-content;
}
.hero .kicker .kdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin-bottom:18px;}
.hero p{color:var(--muted);font-size:16.5px;line-height:1.6;max-width:48ch;margin-bottom:30px;}
.hero-foot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:36px;}
.hero-foot .note{font-size:13px;color:var(--muted);}

/* body map */
.bodymap-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.zone{fill:var(--surface);stroke:var(--line);stroke-width:2;cursor:pointer;transition:fill .15s, stroke .15s;}
.zone:hover{stroke:var(--ink-soft);}
.zone.selected{fill:var(--accent);stroke:var(--ink);}
.zone-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px;}
.zone-chip{
  background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:700;
  padding:6px 8px 6px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;
}
.zone-chip .x{cursor:pointer;opacity:.65;font-size:11px;}
.zone-chip .x:hover{opacity:1;}
.zone-empty{color:var(--muted);font-weight:500;font-size:13px;}

/* floor plan — spatial layout matching the real Center floor plan, rotated so the
   entrance sits at the bottom, the way a member sees it walking in */
svg.floorplan{width:100%;max-width:320px;height:auto;}
.gymzone-context{fill:var(--line);stroke:var(--bg);stroke-width:1.5;}
.gymzone-label{font-size:11px;font-family:"Archivo",sans-serif;font-weight:700;fill:var(--ink-soft);pointer-events:none;text-anchor:middle;}
.gymzone-label.selected{fill:var(--accent-ink);}
.gymzone-context-label{font-size:10px;font-family:"IBM Plex Mono";fill:var(--muted);pointer-events:none;text-anchor:middle;}
.entrance{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;}
.entrance-text{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.05em;text-transform:uppercase;fill:var(--muted);text-anchor:middle;pointer-events:none;}
.entrance-arrow{font-size:14px;fill:var(--muted);text-anchor:middle;pointer-events:none;}

/* outro sections */
.team-wrap{margin-bottom:22px;}
.team-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:480px){.team-grid{grid-template-columns:1fr;}}
.team-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;}
.avatar{
  width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:"Unbounded";font-size:13px;flex:none;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.team-name{font-weight:700;font-size:13.5px;color:var(--ink);}
.team-role{font-size:12px;color:var(--muted);}

.insight-card{
  background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--accent);
  border-radius:14px;padding:16px 18px;margin-bottom:12px;
}
.insight-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;font-family:"IBM Plex Mono";}
.insight-text{font-size:14px;line-height:1.55;color:var(--ink-soft);}

.summary-card{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:26px;display:flex;flex-direction:column;gap:2px;margin:22px 0;
}
.summary-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--muted);flex:none;min-width:160px;}
.summary-row .v{color:var(--ink);font-weight:600;text-align:right;}

.actions-row{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.wa-btn{
  background:#25D366;color:#08210F;border-radius:999px;padding:16px 24px;font-size:15.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;width:100%;
}
.cal-btn{
  background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;
  padding:15px 24px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;
  gap:10px;text-decoration:none;width:100%;
}
.cal-btn:hover{border-color:var(--ink-soft);}
.status-msg{font-size:13px;color:var(--muted);text-align:center;}
.status-msg.ok{color:#3F8A4B;}
.status-msg.err{color:var(--danger);}

.coach-link{
  position:fixed;
  bottom:calc(16px + env(safe-area-inset-bottom));
  right:calc(18px + env(safe-area-inset-right));
  font-size:11.5px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:999px;
  text-decoration:none;font-family:"IBM Plex Mono";opacity:.7;
}
.coach-link:hover{opacity:1;}

.coach-panel{max-width:980px;margin:0 auto;padding:30px 20px 60px;}
.coach-back{font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:18px;display:inline-block;}

/* admin dashboard */
.admin-hint{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 14px;}
.admin-login{max-width:420px;}
.admin-login-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:8px;}
.admin-login-row input{flex:1;min-width:0;}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:22px;}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;}
.kpi-num{font-family:"Unbounded",sans-serif;font-weight:700;font-size:28px;color:var(--ink);}
.kpi-label{font-size:12.5px;color:var(--muted);margin-top:4px;}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-bottom:28px;}
.bars-card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;}
.bars-title{font-size:14px;margin-bottom:12px;}
.bar-row{display:grid;grid-template-columns:minmax(110px,1.6fr) 1.4fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13px;}
.bar-label{color:var(--ink-soft);font-weight:600;overflow-wrap:break-word;hyphens:auto;}
.bar-track{height:8px;border-radius:8px;background:var(--line);overflow:hidden;}
.bar-fill{height:100%;background:var(--ink);border-radius:8px;}
.bar-num{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
.bar-num span{font-weight:400;color:var(--muted);}
.admin-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px;}
.admin-toolbar .bars-title{margin:0;}
.admin-toolbar input{max-width:280px;font-size:15px;}
.admin-actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.admin-actions .btn{padding:10px 14px;font-size:13.5px;border:1.5px solid var(--line);min-height:44px;}
.admin-actions .btn.danger{color:var(--danger);}
.admin-table-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);}
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px;}
.admin-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 12px;border-bottom:1.5px solid var(--line);}
.admin-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink);}
.admin-table input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--ink);}
.admin-row{cursor:pointer;}
.admin-row:hover td{background:var(--bg);}
.admin-detail td{background:var(--bg);}
.coach-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px 18px;font-size:13.5px;}
.coach-grid .k{color:var(--muted);}
@media (max-width:560px){.coach-grid{grid-template-columns:1fr;gap:2px 0;}.coach-grid .k{margin-top:8px;}}

/* reporte PDF (se dibuja fuera de pantalla, siempre en colores claros) */
button.cal-btn{cursor:pointer;font-family:inherit;}
button.cal-btn:disabled{opacity:.6;cursor:progress;}
.pdf-sheet{position:absolute;left:-10000px;top:0;width:760px;}
.pdf-light{
  --bg:#FAFAF9;--surface:#FFFFFF;--ink:#101208;--ink-soft:#3A3D31;--muted:#6E7160;
  --line:#E6E5DC;--accent:#DBFC8B;--accent-ink:#141C08;
  background:#FAFAF9;color:var(--ink);font-family:"Archivo",sans-serif;
}
.pdf-block{background:#FAFAF9;padding-bottom:2px;}
.pdf-light .team-grid{grid-template-columns:1fr 1fr;}
.pdf-light .summary-card{margin:0;}
.pdf-head{display:flex;align-items:center;gap:18px;padding:6px 0 10px;}
.pdf-head .brand-mark{width:60px;height:60px;font-size:20px;}
.pdf-title{font-family:"Unbounded",sans-serif;font-weight:700;font-size:28px;line-height:1.1;color:var(--ink);}
.pdf-sub{font-size:15px;color:var(--muted);margin-top:6px;}
.pdf-intro h2{font-size:24px;line-height:1.2;margin-bottom:8px;}
.pdf-intro p{font-size:15px;line-height:1.6;color:var(--ink-soft);margin:0 0 6px;}
.pdf-foot{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:14px;}

[hidden]{display:none!important;}
</style>
</head>
<body>

<div class="app" id="formApp">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">47</div>
      <div class="brand-name">Vivo 47 Center</div>
    </div>
    <div class="step-count mono" id="stepCount">Inicio</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="stage" id="stage"></div>
</div>

<a class="coach-link" href="#admin" id="coachLink">Admin →</a>

<div class="coach-panel" id="coachPanel" hidden>
  <a class="coach-back" href="#" id="coachBack">← Volver al formulario</a>
  <h2 style="margin-bottom:6px;">Admin</h2>
  <div id="adminBody"></div>
</div>

<script>
(function(){

/* ---------------- DATA MODEL ---------------- */

const OBJETIVOS = ["Ganar músculo","Mejorar mi condición física","Bajar de peso / grasa","Mejorar mi salud","Rendimiento deportivo"];
const DIAS = ["1-2 días","3 días","4-5 días","6+ días"];
const HORARIOS = ["Bloque matutino","Bloque vespertino"];
const DURACIONES = ["30 min","1 hora","1.5 horas","2 horas"];
const RELACION = ["Nunca he sido constante","Estoy retomando","Entreno ocasionalmente","Entreno constantemente"];
const CONDICION = ["Muy baja","Baja","Promedio","Buena","Muy buena"];
const ABANDONO = ["Falta de motivación","No veía resultados","Lesiones / molestias","Me aburría","Me sentía incómodo"];
const CAPACIDADES = ["Movilidad","Fuerza","Potencia","Resistencia"];
const GYM_ZONE_NAMES = {
  salon_clases:"Salón de clases",
  medicion_lab47:"Medición Lab 47",
  funcional_hyrox:"Funcional / Hyrox",
  fuerza_peso_libre:"Fuerza (Peso libre)",
  movilidad:"Movilidad",
  recovery:"Recovery",
  fuerza_integrado:"Fuerza (Peso integrado)",
  fuerza_libre_inferior:"Fuerza (Peso libre, planta baja)",
  cardio:"Resistencia y Potencia (Cardio)"
};

// Equipo y horarios. Horas en formato 24h (.5 = y media).
// shifts: turnos del coach; cada uno con días opcionales y uno o más tramos [inicio, fin].
// Foto: photo:"img/equipo/archivo.jpg". vacant:true no se muestra a los socios.
const TEAM = [
  {name:"Lisset Vázquez", shifts:[{slots:[[5,12]]}], photo:"img/equipo/liss.jpg"},
  {name:"Ricardo Leal", shifts:[{slots:[[5.5,13.5]]}], photo:"img/equipo/ricardo.jpg"},
  {name:"Gerardo Montes", shifts:[{slots:[[5.5,12.5]]}], photo:"img/equipo/gerardo.jpg"},
  {name:"Juan Huerta", shifts:[{slots:[[12,19]]}], photo:"img/equipo/juan.jpg"},
  {name:"Fernando Macías", shifts:[{slots:[[13,20.5]]}], photo:"img/equipo/fernando.jpg"},
  {name:"Paulina Monroy", shifts:[{slots:[[15,22]]}], photo:"img/equipo/pau.jpg"},
  {name:"Arodys Pérez", shifts:[{slots:[[5.5,10],[11.5,16]]}], photo:"img/equipo/arodys.jpg"},
  {name:"Marco Hernández", role:"Lab 47", shifts:[
    {days:"Mar y jue", slots:[[7,14]]},
    {days:"Lun, mié y vie", slots:[[14.5,21.5]]},
    {days:"Sáb", slots:[[9,14]]}
  ], photo:"img/equipo/marco.jpg"},
  {name:"Vacante", shifts:[{slots:[[16,23]]}], vacant:true}
];
// Ventanas de cada bloque; un coach aparece si en algún día trabaja 2 h o más dentro del bloque.
const BLOQUES = {"Bloque matutino":[5,12], "Bloque vespertino":[12,22]};
function overlapHours(a0,a1,b0,b1){ return Math.max(0, Math.min(a1,b1)-Math.max(a0,b0)); }
function coachesFor(block){
  const w = BLOQUES[block];
  return TEAM.filter(m=>!m.vacant && (!w || m.shifts.some(sh=>
    sh.slots.reduce((t,sl)=>t+overlapHours(sl[0],sl[1],w[0],w[1]),0) >= 2)));
}
function fmtHour(h){
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return (((hh+11)%12)+1)+":"+String(mm).padStart(2,"0")+" "+(hh<12?"a.m.":"p.m.");
}
function shiftLines(m){
  return m.shifts.map(sh=>(sh.days ? sh.days+": " : "") + sh.slots.map(sl=>fmtHour(sl[0])+" – "+fmtHour(sl[1])).join(" · "));
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function singleSelect(container, options, key){
  const wrap = el("div","options");
  options.forEach(opt=>{
    const row = el("div","opt single"+(state[key]===opt?" selected":""));
    row.innerHTML = '<span class="badge">✓</span><span>'+opt+'</span>';
    row.onclick = ()=>{ state[key]=opt; persistDraft(); renderStep(); };
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function chipSelect(container, options, key){
  const wrap = el("div","chipwrap");
  options.forEach(opt=>{
    const c = el("div","chip"+(state[key]===opt?" selected":""), opt);
    c.onclick = ()=>{ state[key]=opt; persistDraft(); renderStep(); };
    wrap.appendChild(c);
  });
  container.appendChild(wrap);
}

function multiSelect(container, options, key){
  const wrap = el("div","options");
  options.forEach(opt=>{
    const active = state[key].includes(opt);
    const row = el("div","opt multi"+(active?" selected":""));
    row.innerHTML = '<span class="badge">✓</span><span>'+opt+'</span>';
    row.onclick = ()=>{
      const i = state[key].indexOf(opt);
      if(i>-1) state[key].splice(i,1); else state[key].push(opt);
      persistDraft(); renderStep();
    };
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

/* ---- gym floor plan (multi-select) — a clean, evenly-aligned grid that keeps the
   real Center's rough layout (far zones at top, entrance at the bottom, the way a
   member sees it walking in) but reads like the body map: plain outline, no color
   coding, shades lime on selection. ---- */
function floorplanSVG(selected){
  const sel = id => selected.includes(id) ? "zone selected" : "zone";
  const labelCls = id => "gymzone-label"+(selected.includes(id) ? " selected" : "");
  function cell(id,x,y,w,h,short){
    return '<rect class="'+sel(id)+'" data-zone="'+id+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8"><title>'+GYM_ZONE_NAMES[id]+'</title></rect>'+
           '<text class="'+labelCls(id)+'" x="'+(x+w/2)+'" y="'+(y+h/2+4)+'">'+short+'</text>';
  }
  const cw=84, ch=70, gx=8, gy=8;
  const x1=0, x2=x1+cw+gx, x3=x2+cw+gx;
  const y1=0, y2=y1+ch+gy, y3=y2+ch+gy, y4=y3+ch+gy;
  const totalW = x3+cw, totalH = y4+ch+28+40;
  return '<svg class="floorplan" viewBox="0 0 '+totalW+' '+totalH+'" xmlns="http://www.w3.org/2000/svg">'+
    cell("salon_clases",x1,y1,cw,ch,"Clases")+
    cell("fuerza_peso_libre",x2,y1,cw,ch,"Peso libre")+
    cell("cardio",x3,y1,cw,ch,"Cardio")+

    '<rect class="gymzone-context" x="'+x1+'" y="'+y2+'" width="'+cw+'" height="'+ch+'" rx="8"/>'+
    '<text class="gymzone-context-label" x="'+(x1+cw/2)+'" y="'+(y2+ch/2+3)+'">Oficinas</text>'+
    cell("funcional_hyrox",x2,y2,cw,ch,"Hyrox")+
    cell("fuerza_integrado",x3,y2,cw,ch,"Integrado")+

    cell("medicion_lab47",x1,y3,cw,ch,"Lab 47")+
    cell("movilidad",x2,y3,cw,ch,"Movilidad")+
    cell("recovery",x3,y3,cw,ch,"Recovery")+

    '<rect class="gymzone-context" x="'+x1+'" y="'+y4+'" width="'+cw+'" height="'+ch+'" rx="8"/>'+
    '<text class="gymzone-context-label" x="'+(x1+cw/2)+'" y="'+(y4+ch/2+3)+'">Vestidores</text>'+
    cell("fuerza_libre_inferior",x2,y4,cw*2+gx,ch,"Peso libre (planta baja)")+

    '<rect class="entrance" x="'+(totalW/2-60)+'" y="'+(y4+ch+28)+'" width="120" height="40" rx="10"/>'+
    '<text class="entrance-text" x="'+(totalW/2)+'" y="'+(y4+ch+28+18)+'">Entrada</text>'+
    '<text class="entrance-arrow" x="'+(totalW/2)+'" y="'+(y4+ch+28+34)+'">↑</text>'+
  '</svg>';
}

function renderGymMap(container){
  const wrap = el("div","bodymap-wrap");
  const host = el("div"); host.innerHTML = floorplanSVG(state.zonasGym);
  wrap.appendChild(host);

  host.querySelectorAll("[data-zone]").forEach(node=>{
    node.addEventListener("click", ()=>{
      const z = node.getAttribute("data-zone");
      const i = state.zonasGym.indexOf(z);
      if(i>-1) state.zonasGym.splice(i,1); else state.zonasGym.push(z);
      persistDraft(); renderStep();
    });
  });

  const chips = el("div","zone-chips");
  if(state.zonasGym.length){
    state.zonasGym.forEach(z=>{
      const chip = el("div","zone-chip");
      chip.innerHTML = GYM_ZONE_NAMES[z]+' <span class="x">✕</span>';
      chip.querySelector(".x").onclick = ()=>{ state.zonasGym = state.zonasGym.filter(x=>x!==z); persistDraft(); renderStep(); };
      chips.appendChild(chip);
    });
  } else {
    chips.appendChild(el("span","zone-empty","Toca las zonas del plano que más te interesan"));
  }
  wrap.appendChild(chips);
  container.appendChild(wrap);
}

/* ---- Reporte en PDF: se arma en el navegador, sin enviar nada a ningún servidor ---- */
const PDF_LIBS = [
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
];
let pdfLibsReady = null;
function loadScript(src){
  return new Promise((ok, fail)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = ()=>fail(new Error("No se pudo cargar "+src));
    document.head.appendChild(s);
  });
}
function loadPdfLibs(){
  if(!pdfLibsReady) pdfLibsReady = Promise.all(PDF_LIBS.map(loadScript)).catch(e=>{ pdfLibsReady = null; throw e; });
  return pdfLibsReady;
}
function pdfFileName(){
  const slug = state.nombre.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  return "reporte-bienvenida-vivo47"+(slug ? "-"+slug : "")+".pdf";
}

async function buildPdf(){
  await loadPdfLibs();
  if(document.fonts && document.fonts.ready) await document.fonts.ready;

  const sheet = el("div","pdf-sheet pdf-light");
  const first = state.nombre.trim().split(" ")[0] || "";
  const today = new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});

  const head = el("div","pdf-block pdf-head");
  head.innerHTML = '<div class="brand-mark">47</div><div><div class="pdf-title">Tu reporte de bienvenida</div>'+
    '<div class="pdf-sub">Vivo 47 Center · '+escapeHtml(today)+'</div></div>';
  sheet.appendChild(head);

  const intro = el("div","pdf-block pdf-intro");
  intro.innerHTML = '<h2>'+escapeHtml(first ? first+", ya diste el primer paso." : "Ya diste el primer paso.")+'</h2>'+
    '<p>Te esperamos el '+escapeHtml(fmtDate(state.diaVemos)||"día acordado")+'. Aquí tienes a tu equipo, las recomendaciones para ti y el resumen de tus respuestas.</p>';
  sheet.appendChild(intro);

  const blocks = reportBlocks();
  const summary = blocks.pop();
  blocks.forEach(b=>{ b.classList.add("pdf-block"); sheet.appendChild(b); });
  const summaryBlock = el("div","pdf-block");
  summaryBlock.appendChild(el("div","team-title","Resumen de tus respuestas"));
  summaryBlock.appendChild(summary);
  sheet.appendChild(summaryBlock);
  sheet.appendChild(el("div","pdf-block pdf-foot","Real. Posible. Tuyo."));
  document.body.appendChild(sheet);

  try{
    await Promise.all(Array.from(sheet.querySelectorAll("img")).map(img=> img.complete ? Promise.resolve() : new Promise(r=>{ img.onload = img.onerror = r; })));
    const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
    const pageW = 210, pageH = 297, margin = 14, gap = 4, usableW = pageW - 2*margin;
    const paint = ()=>{ doc.setFillColor(250,250,249); doc.rect(0, 0, pageW, pageH, "F"); };
    paint();
    let y = margin;
    for(const block of Array.from(sheet.children)){
      const canvas = await window.html2canvas(block, {scale:2, backgroundColor:"#FAFAF9", useCORS:true, logging:false});
      const h = canvas.height * usableW / canvas.width;
      if(y > margin && y + h > pageH - margin){ doc.addPage(); paint(); y = margin; }
      doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", margin, y, usableW, h);
      y += h + gap;
    }
    return doc;
  } finally {
    sheet.remove();
  }
}

async function downloadPdf(btn, statusEl){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Preparando tu PDF…";
  try{
    const doc = await buildPdf();
    doc.save(pdfFileName());
  }catch(e){
    statusEl.textContent = "No pudimos crear el PDF. Inténtalo de nuevo.";
    statusEl.className = "status-msg err";
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
}

function fmtDate(v){
  if(!v) return "";
  const d = new Date(String(v).slice(0,10)+"T00:00:00");
  if(isNaN(d)) return v;
  return d.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function buildWhatsAppLink(){

function buildCalendarLink(){
  if(!state.diaVemos) return "#";
  const start = state.diaVemos.replace(/-/g,"");
  const endD = new Date(state.diaVemos+"T00:00:00");
  endD.setDate(endD.getDate()+1);
  const end = endD.toISOString().slice(0,10).replace(/-/g,"");
  const text = encodeURIComponent("Primer entrenamiento en Vivo 47 Center");
  const details = encodeURIComponent("Tu primera sesión en Vivo 47 Center. Objetivo: "+state.objetivo);
  const location = encodeURIComponent("Vivo 47 Center");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+text+"&dates="+start+"/"+end+"&details="+details+"&location="+location;
}

function renderStep(){
  const step = steps[stepIndex];
  stepCountEl.textContent = ("0"+(stepIndex+1)).slice(-2)+" / "+("0"+steps.length).slice(-2);
  progressFill.style.width = Math.round(((stepIndex)/(steps.length))*100)+"%";

  stage.innerHTML = "";
  const eyebrow = el("div","eyebrow",'<span class="dot"></span>'+step.eyebrow);
  const title = el("h2","q-title", typeof step.title==="function" ? step.title() : step.title);
  stage.appendChild(eyebrow);
  stage.appendChild(title);
  if(step.sub) stage.appendChild(el("div","q-sub", step.sub));

  step.render(stage);

  const nav = el("div","nav-row");
  const back = el("button","btn btn-ghost", stepIndex===0 ? "← Inicio" : "← Atrás");
  back.onclick = ()=>{ stepIndex--; if(stepIndex<0){ renderIntro(); } else renderStep(); };
  const nextLabel = stepIndex===steps.length-1 ? "Enviar ficha →" : "Continuar →";
  const next = document.createElement("button");
  next.className = "btn btn-primary"; next.id="nextBtn";
  next.innerHTML = nextLabel;
  next.onclick = goNext;
  nav.appendChild(back); nav.appendChild(next);
  stage.appendChild(nav);
  updateNav();
}

function updateNav(){
  const btn = document.getElementById("nextBtn");
  if(!btn) return;
  const step = steps[stepIndex];
  btn.disabled = !step.valid();
}

function goNext(){
  const step = steps[stepIndex];
  if(!step.valid()) return;
  if(stepIndex === steps.length-1){
    renderOutro();
    return;
  }
  stepIndex++;
  renderStep();
}

/* ---------------- PERSISTENCE (Firebase) ----------------
   Con FIREBASE_API_KEY, FIREBASE_PROJECT_ID y ADMIN_EMAIL configurados, cada
   encuesta se guarda en la colección "respuestas" de Firestore (reglas en
   firebase/firestore.rules). Sin ellos, se guarda solo en este navegador para
   poder probar. Se usa la API REST de Firebase: no hay librerías que cargar. */

const FB_READY = !!(FIREBASE_API_KEY && FIREBASE_PROJECT_ID && ADMIN_EMAIL);
const FS_ROOT = "projects/"+FIREBASE_PROJECT_ID+"/databases/(default)/documents";
const FS_BASE = "https://firestore.googleapis.com/v1/"+FS_ROOT;
const AUTH_URL = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+FIREBASE_API_KEY;
const LOCAL_RESPONSES_KEY = "vivo47_responses_local_v2";

function toRow(s){
  return {
    nombre: s.nombre.trim(),
    lada: s.lada.trim(),
    telefono: s.telefono.replace(/[^0-9]/g,""),
    objetivo: s.objetivo,
    meta90: s.meta90.trim(),
    dias: s.dias,
    horario: s.horario,
    duracion: s.duracion,
    capacidad: s.capacidad.slice(),
    zonas_gym: s.zonasGym.slice(),
    relacion: s.relacion,
    condicion: s.condicion,
    abandono: s.abandono.slice(),
    frase: s.frase.trim(),
    dia_vemos: s.diaVemos || null
  };
}

function toFsValue(v){
  if(Array.isArray(v)) return v.length ? {arrayValue:{values:v.map(toFsValue)}} : {arrayValue:{}};
  return {stringValue:String(v)};
}
function toFsFields(row){
  const f = {};
  Object.keys(row).forEach(k=>{ if(row[k] !== null && row[k] !== undefined) f[k] = toFsValue(row[k]); });
  return f;
}
function fromFsValue(v){
  if("stringValue" in v) return v.stringValue;
  if("arrayValue" in v) return (v.arrayValue.values || []).map(fromFsValue);
  if("timestampValue" in v) return v.timestampValue;
  if("integerValue" in v) return Number(v.integerValue);
  if("booleanValue" in v) return v.booleanValue;
  return null;
}
function fromFsDoc(doc){
  const row = {id: doc.name.split("/").pop(), created_at: doc.createTime};
  Object.keys(doc.fields || {}).forEach(k=>{ row[k] = fromFsValue(doc.fields[k]); });
  return row;
}

async function fsFetch(url, opts){
  const o = opts || {};
  const res = await fetch(url, {
    method: o.method || "GET",
    headers: Object.assign({"Content-Type":"application/json"}, o.token ? {"Authorization":"Bearer "+o.token} : {}),
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){}
  if(!res.ok){
    const code = (data && data.error && data.error.message) || ("HTTP "+res.status);
    const err = new Error(o.token && (res.status === 401 || res.status === 403) ? "PASSWORD_INCORRECTA" : code);
    err.code = code;
    throw err;
  }
  return data;
}

let fbIdToken = "";
let fbTokenAt = 0;
async function fbSignIn(pw){
  try{
    const d = await fsFetch(AUTH_URL, {method:"POST", body:{email:ADMIN_EMAIL, password:pw, returnSecureToken:true}});
    fbIdToken = d.idToken; fbTokenAt = Date.now();
    return true;
  }catch(e){
    if(/INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|USER_DISABLED/.test(e.code || "")) return false;
    throw e;
  }
}
async function fbToken(pw){
  if(!fbIdToken || Date.now() - fbTokenAt > 50*60*1000){
    if(!(await fbSignIn(pw))) throw new Error("PASSWORD_INCORRECTA");
  }
  return fbIdToken;
}
async function fbList(pw){
  const token = await fbToken(pw);
  let rows = [], pageToken = "";
  do{
    const d = await fsFetch(FS_BASE+"/respuestas?pageSize=300"+(pageToken ? "&pageToken="+encodeURIComponent(pageToken) : ""), {token:token});
    (d.documents || []).forEach(doc=>rows.push(fromFsDoc(doc)));
    pageToken = d.nextPageToken || "";
  }while(pageToken);
  return rows.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
}
async function fbRemove(pw, ids){
  const token = await fbToken(pw);
  for(let i = 0; i < ids.length; i += 400){
    const writes = ids.slice(i, i+400).map(id=>({"delete": FS_ROOT+"/respuestas/"+id}));
    const d = await fsFetch(FS_BASE+":batchWrite", {method:"POST", token:token, body:{writes:writes}});
    if((d.status || []).some(st=>st.code)) throw new Error("No se pudo borrar");
  }
  return ids.length;
}

function readLocal(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_RESPONSES_KEY)||"[]"); }catch(e){ return []; }
}
function writeLocal(list){
  try{ localStorage.setItem(LOCAL_RESPONSES_KEY, JSON.stringify(list.slice(0,200))); }catch(e){}
}
function saveLocal(row){
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
  writeLocal([Object.assign({id:id, created_at:new Date().toISOString()}, row)].concat(readLocal()));
}

async function saveResponse(statusEl){
  const row = toRow(state);
  let saved = false;
  if(FB_READY){
    try{
      await fsFetch(FS_BASE+"/respuestas?key="+FIREBASE_API_KEY, {method:"POST", body:{fields:toFsFields(row)}});
      saved = true;
    }catch(e){
      statusEl.textContent = "No pudimos guardar tu respuesta en este momento. Puedes enviarla por WhatsApp igualmente.";
      statusEl.className = "status-msg err";
      saveLocal(row);
    }
  } else {
    saveLocal(row);
    saved = true;
  }
  if(saved){
    statusEl.textContent = "";
    statusEl.className = "status-msg";
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }
}

/* ---------------- ADMIN ----------------
   Con Firebase, la contraseña es la de la cuenta de administrador de Firebase
   Auth (ADMIN_EMAIL) y las reglas de Firestore solo dejan leer y borrar a esa
   cuenta. Sin Firebase, el panel solo muestra lo guardado en este navegador. */

const store = FB_READY ? {
  local: false,
  login: pw => fbSignIn(pw),
  list: pw => fbList(pw),
  remove: (pw, ids) => fbRemove(pw, ids),
  removeAll: async pw => fbRemove(pw, (await fbList(pw)).map(r=>r.id))
} : {
  local: true,
  login: async () => true,
  list: async () => readLocal(),
  remove: async (pw, ids) => { writeLocal(readLocal().filter(r=>!ids.includes(r.id))); return ids.length; },
  removeAll: async () => { const n = readLocal().length; writeLocal([]); return n; }
};

function tally(rows, pick, label){
  const m = {};
  rows.forEach(r=>{
    [].concat(pick(r) || []).forEach(v=>{
      if(v === null || v === undefined || v === "") return;
      const k = label ? label(v) : v;
      m[k] = (m[k] || 0) + 1;
    });
  });
  return Object.keys(m).map(k=>[k, m[k]]).sort((a,b)=>b[1]-a[1]);
}

    const pct = total ? Math.round(n*100/total) : 0;
    const row = el("div","bar-row");
    row.innerHTML = '<div class="bar-label">'+escapeHtml(label)+'</div>'+

}

function csvCell(v){

  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCsv(){
  if(!adminRows.length){ alert("No hay registros que exportar."); return; }
  const NL = String.fromCharCode(10);
  const head = ["Fecha","Nombre","Teléfono","Objetivo","Meta 90 días","Días","Horario","Duración","Capacidad física","Áreas de Center","Relación con ejercicio","Condición física","Motivos de abandono","Frase de rescate","Primer día en Center"];
  const lines = [head.map(csvCell).join(",")].concat(adminRows.map(r=>[
    r.created_at, r.nombre, (r.lada||"")+" "+(r.telefono||""), r.objetivo, r.meta90, r.dias, r.horario, r.duracion,
    r.capacidad, gymNames(r.zonas_gym), r.relacion, r.condicion, r.abandono, r.frase, r.dia_vemos
  ].map(csvCell).join(",")));
  const blob = new Blob(["﻿"+lines.join(NL)], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "encuesta-bienvenida-vivo47.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

renderIntro();

})();
