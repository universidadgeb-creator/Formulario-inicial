<title>Ficha de Bienvenida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAFAF9;
  --surface:#FFFFFF;
  --ink:#101208;
  --ink-soft:#3A3D31;
  --muted:#6E7160;
  --line:#E6E5DC;
  --accent:#DBFC8B;
  --accent-ink:#141C08;
  --danger:#B3452E;
  --chip-bg:#12140B;
  --chip-fg:#F5F6EE;
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101108;
    --surface:#17190E;
    --ink:#F4F5EC;
    --ink-soft:#D3D5C4;
    --muted:#9A9E86;
    --line:#2B2E1E;
    --accent:#DBFC8B;
    --accent-ink:#101108;
  }
}
:root[data-theme="dark"]{
  --bg:#101108;
  --surface:#17190E;
  --ink:#F4F5EC;
  --ink-soft:#D3D5C4;
  --muted:#9A9E86;
  --line:#2B2E1E;
  --accent:#DBFC8B;
  --accent-ink:#101108;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Unbounded",ui-sans-serif,system-ui,sans-serif;text-wrap:balance;margin:0;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
button{font-family:inherit;}
::selection{background:var(--accent);color:var(--accent-ink);}

.app{
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:0 24px 40px;
}

/* ---- top bar ---- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 0 16px;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:50%;
  background:var(--ink);color:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-family:"Unbounded";font-weight:700;font-size:13px;
  flex:none;
}
.brand-name{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);}
.step-count{font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}

.progress-track{
  height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:8px;
}
.progress-fill{
  height:100%;background:var(--ink);border-radius:4px;
  transition:width .45s cubic-bezier(.65,0,.35,1);
}
:root[data-theme="dark"] .progress-fill,
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .progress-fill{background:var(--accent);} }

.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:28px 0 8px;
}

.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}

.q-title{font-size:clamp(24px,4.4vw,34px);font-weight:700;line-height:1.16;margin-bottom:8px;}
.q-sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:26px;max-width:52ch;}

.field{margin-bottom:22px;}
input[type=text], input[type=tel], input[type=date], textarea{
  width:100%;
  font-family:"Archivo",sans-serif;
  font-size:19px;
  font-weight:500;
  color:var(--ink);
  background:transparent;
  border:none;
  border-bottom:2px solid var(--line);
  padding:10px 2px 12px;
  outline:none;
  transition:border-color .2s;
}
input::placeholder, textarea::placeholder{color:var(--muted);font-weight:400;}
input:focus, textarea:focus{border-bottom-color:var(--ink);}
textarea{resize:vertical;min-height:110px;line-height:1.5;font-size:17px;}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;}

.phone-row{display:flex;gap:14px;}
.phone-row input.lada{width:66px;flex:none;text-align:center;}
.phone-row input.num{flex:1;}

.options{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:center;gap:14px;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:15px 18px;
  cursor:pointer;
  background:var(--surface);
  transition:border-color .15s, background .15s, transform .1s;
  font-size:15.5px;
  font-weight:600;
  color:var(--ink-soft);
  user-select:none;
}
.opt:hover{border-color:var(--ink-soft);}
.opt .badge{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
  flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;transition:all .15s;
}
.opt.multi .badge{border-radius:6px;}
.opt.single .badge{border-radius:50%;}
.opt.selected{border-color:var(--ink);background:var(--accent);color:var(--accent-ink);}
.opt.selected .badge{background:var(--ink);border-color:var(--ink);color:var(--accent);}
:root[data-theme="dark"] .opt.selected .badge, @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt.selected .badge{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent);}}

.chipwrap{display:flex;flex-wrap:wrap;gap:9px;}
.chip{
  border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;
  font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;background:var(--surface);
  transition:all .15s;
}
.chip.selected{background:var(--ink);border-color:var(--ink);color:var(--bg);}
:root[data-theme="dark"] .chip.selected, @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.selected{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}}

.subblock{margin-bottom:24px;}
.subblock-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;}

/* nav buttons */
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:8px;padding-top:18px;}
.btn{
  border:none;border-radius:999px;padding:15px 26px;font-size:15px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s, opacity .12s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--bg);}
:root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{background:var(--accent);color:var(--accent-ink);}}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--muted);padding:15px 8px;}
.btn-ghost:hover{color:var(--ink);}

/* intro / outro */
.hero{
  display:flex;flex-direction:column;justify-content:center;flex:1;padding:40px 0;
}
.hero .kicker{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--chip-bg);color:var(--chip-fg);
  font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;margin-bottom:22px;width:fit-content;
}
.hero .kicker .kdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin-bottom:18px;}
.hero p{color:var(--muted);font-size:16.5px;line-height:1.6;max-width:48ch;margin-bottom:30px;}
.hero-foot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:36px;}
.hero-foot .note{font-size:13px;color:var(--muted);}

/* body map */
.bodymap-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.bodymap-dual{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;width:100%;}
.bodymap-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:130px;max-width:180px;}
.bodymap-col .col-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
svg.silhouette{width:100%;max-width:160px;height:auto;}
.zone{fill:var(--surface);stroke:var(--line);stroke-width:2;cursor:pointer;transition:fill .15s, stroke .15s;}
.zone:hover{stroke:var(--ink-soft);}
.zone.selected{fill:var(--accent);stroke:var(--ink);}
.silhouette-outline{fill:none;stroke:var(--line);stroke-width:1.5;}
.zone-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px;}
.zone-chip{
  background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:700;
  padding:6px 8px 6px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;
}
.zone-chip .x{cursor:pointer;opacity:.65;font-size:11px;}
.zone-chip .x:hover{opacity:1;}
.zone-empty{color:var(--muted);font-weight:500;font-size:13px;}

/* floor plan — spatial layout matching the real Center floor plan, rotated so the
   entrance sits at the bottom, the way a member sees it walking in */
svg.floorplan{width:100%;max-width:320px;height:auto;}
.gymzone-context{fill:var(--line);stroke:var(--bg);stroke-width:1.5;}
.gymzone-label{font-size:11px;font-family:"Archivo",sans-serif;font-weight:700;fill:var(--ink-soft);pointer-events:none;text-anchor:middle;}
.gymzone-label.selected{fill:var(--accent-ink);}
.gymzone-context-label{font-size:10px;font-family:"IBM Plex Mono";fill:var(--muted);pointer-events:none;text-anchor:middle;}
.entrance{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;}
.entrance-text{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.05em;text-transform:uppercase;fill:var(--muted);text-anchor:middle;pointer-events:none;}
.entrance-arrow{font-size:14px;fill:var(--muted);text-anchor:middle;pointer-events:none;}

/* outro sections */
.team-wrap{margin-bottom:22px;}
.team-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:480px){.team-grid{grid-template-columns:1fr;}}
.team-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;}
.avatar{
  width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:"Unbounded";font-size:13px;flex:none;
}
.team-name{font-weight:700;font-size:13.5px;color:var(--ink);}
.team-role{font-size:12px;color:var(--muted);}

.insight-card{
  background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--accent);
  border-radius:14px;padding:16px 18px;margin-bottom:12px;
}
.insight-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;font-family:"IBM Plex Mono";}
.insight-text{font-size:14px;line-height:1.55;color:var(--ink-soft);}

.summary-card{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:26px;display:flex;flex-direction:column;gap:2px;margin:22px 0;
}
.summary-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--muted);flex:none;min-width:160px;}
.summary-row .v{color:var(--ink);font-weight:600;text-align:right;}

.actions-row{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.wa-btn{
  background:#25D366;color:#08210F;border-radius:999px;padding:16px 24px;font-size:15.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;width:100%;
}
.cal-btn{
  background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;
  padding:15px 24px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;
  gap:10px;text-decoration:none;width:100%;
}
.cal-btn:hover{border-color:var(--ink-soft);}
.status-msg{font-size:13px;color:var(--muted);text-align:center;}
.status-msg.ok{color:#3F8A4B;}
.status-msg.err{color:var(--danger);}

.coach-link{
  position:fixed;bottom:16px;right:18px;font-size:11.5px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:999px;
  text-decoration:none;font-family:"IBM Plex Mono";opacity:.7;
}
.coach-link:hover{opacity:1;}

.coach-panel{max-width:820px;margin:0 auto;padding:30px 24px 60px;}
.coach-back{font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:18px;display:inline-block;}
.coach-entry{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px;}
.coach-entry h3{font-size:17px;margin-bottom:4px;}
.coach-entry .meta{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono";margin-bottom:10px;}
.coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13.5px;}
.coach-grid .k{color:var(--muted);}
@media (max-width:560px){.coach-grid{grid-template-columns:1fr;}}

[hidden]{display:none!important;}
</style>

<div class="app" id="formApp">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">47</div>
      <div class="brand-name">Vivo 47 Center</div>
    </div>
    <div class="step-count mono" id="stepCount">Inicio</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="stage" id="stage"></div>
</div>

<a class="coach-link" href="#coaches" id="coachLink">Admin →</a>

<div class="coach-panel" id="coachPanel" hidden>
  <a class="coach-back" href="#" id="coachBack">← Volver al formulario</a>
  <h2 style="margin-bottom:6px;">Admin</h2>
  <div id="coachList"></div>
</div>

<script>
(function(){

/* ---------------- DATA MODEL ---------------- */

const OBJETIVOS = ["Ganar músculo","Mejorar mi condición física","Bajar de peso / grasa","Mejorar mi salud","Rendimiento deportivo"];
const DIAS = ["1-2 días","3 días","4-5 días","6+ días"];
const HORARIOS = ["Bloque matutino","Bloque vespertino","Bloque intermedio"];
const DURACIONES = ["30 min","1 hora","1.5 horas","2 horas"];
const RELACION = ["Nunca he sido constante","Estoy retomando","Entreno ocasionalmente","Entreno constantemente"];
const CONDICION = ["Muy baja","Baja","Promedio","Buena","Muy buena"];
const ABANDONO = ["Falta de motivación","No veía resultados","Lesiones / molestias","Me aburría","Me sentía incómodo"];
const GYM_ZONE_NAMES = {
  salon_clases:"Salón de clases",
  medicion_lab47:"Medición Lab 47",
  funcional_hyrox:"Funcional / Hyrox",
  fuerza_peso_libre:"Fuerza (Peso libre)",
  movilidad:"Movilidad",
  recovery:"Recovery",
  fuerza_integrado:"Fuerza (Peso integrado)",
  fuerza_libre_inferior:"Fuerza (Peso libre, planta baja)",
  cardio:"Resistencia y Potencia (Cardio)"
};

// Placeholder de staff — reemplazar con el equipo real (nombre y rol) por turno.
const TEAM = {
  "Bloque matutino": [
    {name:"Coach Ana Ruiz", role:"Fuerza y Movilidad"},
    {name:"Coach Marcos Vidal", role:"Funcional / Hyrox"}
  ],
  "Bloque vespertino": [
    {name:"Coach Diego Palma", role:"Fuerza y Potencia"},
    {name:"Coach Fernanda Lira", role:"Recovery y Movilidad"}
  ],
  "Bloque intermedio": [
    {name:"Coach Ana Ruiz", role:"Fuerza y Movilidad"},
    {name:"Coach Diego Palma", role:"Fuerza y Potencia"}
  ]
};

const INCONSISTENTES = ["Nunca he sido constante","Estoy retomando","Entreno ocasionalmente"];

const TIPS = {
  "Falta de motivación":"Pide a tu coach un check-in semanal — la rendición de cuentas sostiene la motivación mejor que la fuerza de voluntad.",
  "No veía resultados":"Agenda tu primera medición en Lab 47 y una revisión con nutriólogo — sin datos es difícil ver el progreso real.",
  "Lesiones / molestias":"Cuéntale a tu coach sobre esas molestias antes de tu primera sesión para adaptar tu plan de movilidad.",
  "Me aburría":"Prueba al menos una clase grupal o un Hyrox social este mes — variar el estímulo sostiene el interés.",
  "Me sentía incómodo":"Center está pensado como ambiente familiar — tu coach te acompaña de cerca las primeras semanas para que te sientas en confianza."
};

const state = {
  nombre:"", lada:"+52", telefono:"",
  objetivo:"", meta90:"",
  dias:"", horario:"", duracion:"",
  zonas:[], zonasGym:[],
  relacion:"", condicion:"", abandono:[], frase:"",
  diaVemos:""
};

const STORAGE_KEY = "vivo47_intake_draft_v2";
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(saved) Object.assign(state, saved);
}catch(e){}
function persistDraft(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------------- STEP DEFINITIONS ---------------- */
let stepIndex = -1; // -1 = intro

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function singleSelect(container, options, key){
  const wrap = el("div","options");
  options.forEach(opt=>{
    const row = el("div","opt single"+(state[key]===opt?" selected":""));
    row.innerHTML = '<span class="badge">✓</span><span>'+opt+'</span>';
    row.onclick = ()=>{ state[key]=opt; persistDraft(); renderStep(); };
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function chipSelect(container, options, key){
  const wrap = el("div","chipwrap");
  options.forEach(opt=>{
    const c = el("div","chip"+(state[key]===opt?" selected":""), opt);
    c.onclick = ()=>{ state[key]=opt; persistDraft(); renderStep(); };
    wrap.appendChild(c);
  });
  container.appendChild(wrap);
}

function multiSelect(container, options, key){
  const wrap = el("div","options");
  options.forEach(opt=>{
    const active = state[key].includes(opt);
    const row = el("div","opt multi"+(active?" selected":""));
    row.innerHTML = '<span class="badge">✓</span><span>'+opt+'</span>';
    row.onclick = ()=>{
      const i = state[key].indexOf(opt);
      if(i>-1) state[key].splice(i,1); else state[key].push(opt);
      persistDraft(); renderStep();
    };
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

/* ---- body map zones (multi-select, front + back shown together) ---- */
const ZONES_FRONT = [
  {id:"hombros_brazos", label:"Hombros y brazos"},
  {id:"pecho", label:"Pecho"},
  {id:"abdomen", label:"Abdomen"},
  {id:"piernas_frente", label:"Piernas"}
];
const ZONES_BACK = [
  {id:"espalda", label:"Espalda"},
  {id:"gluteos", label:"Glúteos"},
  {id:"piernas_post", label:"Piernas (posterior)"}
];
const ZONE_NAMES = {};
ZONES_FRONT.concat(ZONES_BACK).forEach(z=>ZONE_NAMES[z.id]=z.label);

function frontSVG(selected){
  const sel = id => selected.includes(id) ? "zone selected" : "zone";
  return '<svg class="silhouette" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">'+
    '<circle class="silhouette-outline" cx="100" cy="34" r="24"/>'+
    '<path class="'+sel("hombros_brazos")+'" data-zone="hombros_brazos" d="M60 70 Q30 78 24 130 Q22 190 34 235 L56 232 Q48 180 52 130 Q54 100 70 82 Z"/>'+
    '<path class="'+sel("hombros_brazos")+'" data-zone="hombros_brazos" d="M140 70 Q170 78 176 130 Q178 190 166 235 L144 232 Q152 180 148 130 Q146 100 130 82 Z"/>'+
    '<path class="'+sel("pecho")+'" data-zone="pecho" d="M70 82 Q100 68 130 82 L134 150 Q100 162 66 150 Z"/>'+
    '<path class="'+sel("abdomen")+'" data-zone="abdomen" d="M66 150 Q100 162 134 150 L128 224 Q100 236 72 224 Z"/>'+
    '<path class="'+sel("piernas_frente")+'" data-zone="piernas_frente" d="M72 224 Q100 236 128 224 L134 388 Q116 396 106 388 L102 260 L98 260 L94 388 Q84 396 66 388 Z"/>'+
  '</svg>';
}
function backSVG(selected){
  const sel = id => selected.includes(id) ? "zone selected" : "zone";
  return '<svg class="silhouette" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">'+
    '<circle class="silhouette-outline" cx="100" cy="34" r="24"/>'+
    '<path class="silhouette-outline" d="M60 70 Q30 78 24 130 Q22 190 34 235 L56 232 Q48 180 52 130 Q54 100 70 82 Z"/>'+
    '<path class="silhouette-outline" d="M140 70 Q170 78 176 130 Q178 190 166 235 L144 232 Q152 180 148 130 Q146 100 130 82 Z"/>'+
    '<path class="'+sel("espalda")+'" data-zone="espalda" d="M68 80 Q100 66 132 80 L136 188 Q100 202 64 188 Z"/>'+
    '<path class="'+sel("gluteos")+'" data-zone="gluteos" d="M64 188 Q100 202 136 188 L130 238 Q100 250 70 238 Z"/>'+
    '<path class="'+sel("piernas_post")+'" data-zone="piernas_post" d="M70 238 Q100 250 130 238 L134 388 Q116 396 106 388 L102 268 L98 268 L94 388 Q84 396 66 388 Z"/>'+

/* ---- gym floor plan (multi-select) — a clean, evenly-aligned grid that keeps the
   real Center's rough layout (far zones at top, entrance at the bottom, the way a
   member sees it walking in) but reads like the body map: plain outline, no color
   coding, shades lime on selection. ---- */
function floorplanSVG(selected){
  const sel = id => selected.includes(id) ? "zone selected" : "zone";
  const labelCls = id => "gymzone-label"+(selected.includes(id) ? " selected" : "");
  function cell(id,x,y,w,h,short){
    return '<rect class="'+sel(id)+'" data-zone="'+id+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8"><title>'+GYM_ZONE_NAMES[id]+'</title></rect>'+
           '<text class="'+labelCls(id)+'" x="'+(x+w/2)+'" y="'+(y+h/2+4)+'">'+short+'</text>';
  }
  const cw=84, ch=70, gx=8, gy=8;
  const x1=0, x2=x1+cw+gx, x3=x2+cw+gx;
  const y1=0, y2=y1+ch+gy, y3=y2+ch+gy, y4=y3+ch+gy;
  const totalW = x3+cw, totalH = y4+ch+28+40;
  return '<svg class="floorplan" viewBox="0 0 '+totalW+' '+totalH+'" xmlns="http://www.w3.org/2000/svg">'+
    cell("salon_clases",x1,y1,cw,ch,"Clases")+
    cell("fuerza_peso_libre",x2,y1,cw,ch,"Peso libre")+
    cell("cardio",x3,y1,cw,ch,"Cardio")+

    '<rect class="gymzone-context" x="'+x1+'" y="'+y2+'" width="'+cw+'" height="'+ch+'" rx="8"/>'+
    '<text class="gymzone-context-label" x="'+(x1+cw/2)+'" y="'+(y2+ch/2+3)+'">Oficinas</text>'+
    cell("funcional_hyrox",x2,y2,cw,ch,"Hyrox")+
    cell("fuerza_integrado",x3,y2,cw,ch,"Integrado")+

    cell("medicion_lab47",x1,y3,cw,ch,"Lab 47")+
    cell("movilidad",x2,y3,cw,ch,"Movilidad")+
    cell("recovery",x3,y3,cw,ch,"Recovery")+

    '<rect class="gymzone-context" x="'+x1+'" y="'+y4+'" width="'+cw+'" height="'+ch+'" rx="8"/>'+
    '<text class="gymzone-context-label" x="'+(x1+cw/2)+'" y="'+(y4+ch/2+3)+'">Vestidores</text>'+
    cell("fuerza_libre_inferior",x2,y4,cw*2+gx,ch,"Peso libre (planta baja)")+

    '<rect class="entrance" x="'+(totalW/2-60)+'" y="'+(y4+ch+28)+'" width="120" height="40" rx="10"/>'+
    '<text class="entrance-text" x="'+(totalW/2)+'" y="'+(y4+ch+28+18)+'">Entrada</text>'+
    '<text class="entrance-arrow" x="'+(totalW/2)+'" y="'+(y4+ch+28+34)+'">↑</text>'+
  '</svg>';
}

function fmtDate(v){
  if(!v) return "";
  const d = new Date(v+"T00:00:00");
  if(isNaN(d)) return v;
  return d.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function buildWhatsAppLink(){
  const lines = [
    "Ficha de bienvenida — Vivo 47 Center",
    "Nombre: "+state.nombre,
    "Teléfono: "+state.lada+" "+state.telefono,
    "Objetivo: "+state.objetivo,
    "Meta 90 días: "+state.meta90,
    "Días/semana: "+state.dias+" · Horario: "+state.horario+" · Duración: "+state.duracion,
    "Zonas del cuerpo: "+state.zonas.map(z=>ZONE_NAMES[z]).join(", "),
    "Áreas de Center: "+state.zonasGym.map(z=>GYM_ZONE_NAMES[z]).join(", "),
    "Relación con el ejercicio: "+state.relacion,
    "Condición física: "+state.condicion,
    "Motivos de abandono previo: "+state.abandono.join(", "),
    "Frase de rescate: "+state.frase,
    "Te vemos en Center: "+fmtDate(state.diaVemos)
  ];
  return "https://wa.me/?text="+encodeURIComponent(lines.join("\n"));
}

function buildCalendarLink(){
  if(!state.diaVemos) return "#";
  const start = state.diaVemos.replace(/-/g,"");
  const endD = new Date(state.diaVemos+"T00:00:00");
  endD.setDate(endD.getDate()+1);
  const end = endD.toISOString().slice(0,10).replace(/-/g,"");
  const text = encodeURIComponent("Primer entrenamiento en Vivo 47 Center");
  const details = encodeURIComponent("Tu primera sesión en Vivo 47 Center. Objetivo: "+state.objetivo);
  const location = encodeURIComponent("Vivo 47 Center");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+text+"&dates="+start+"/"+end+"&details="+details+"&location="+location;
}

function renderStep(){
  const step = steps[stepIndex];
  stepCountEl.textContent = ("0"+(stepIndex+1)).slice(-2)+" / "+("0"+steps.length).slice(-2);
  progressFill.style.width = Math.round(((stepIndex)/(steps.length))*100)+"%";

  stage.innerHTML = "";
  const eyebrow = el("div","eyebrow",'<span class="dot"></span>'+step.eyebrow);
  const title = el("h2","q-title", typeof step.title==="function" ? step.title() : step.title);
  stage.appendChild(eyebrow);
  stage.appendChild(title);
  if(step.sub) stage.appendChild(el("div","q-sub", step.sub));

  step.render(stage);

  const nav = el("div","nav-row");
  const back = el("button","btn btn-ghost", stepIndex===0 ? "← Inicio" : "← Atrás");
  back.onclick = ()=>{ stepIndex--; if(stepIndex<0){ renderIntro(); } else renderStep(); };
  const nextLabel = stepIndex===steps.length-1 ? "Enviar ficha →" : "Continuar →";
  const next = document.createElement("button");
  next.className = "btn btn-primary"; next.id="nextBtn";
  next.innerHTML = nextLabel;
  next.onclick = goNext;
  nav.appendChild(back); nav.appendChild(next);
  stage.appendChild(nav);
  updateNav();
}

function updateNav(){
  const btn = document.getElementById("nextBtn");
  if(!btn) return;
  const step = steps[stepIndex];
  btn.disabled = !step.valid();
}

function goNext(){
  const step = steps[stepIndex];
  if(!step.valid()) return;
  if(stepIndex === steps.length-1){
    renderOutro();
    return;
  }
  stepIndex++;
  renderStep();
}

/* ---------------- PERSISTENCE ----------------
   No backend is connected yet — responses live only in this browser
   (localStorage) plus whatever the socio sends via WhatsApp / calendar.
   To wire up a real database later, replace the body of saveResponse()
   with a call to your API (e.g. fetch("/api/responses", {method:"POST",
   body: JSON.stringify(state)})) and update loadAdminData() to read from it. */

const LOCAL_RESPONSES_KEY = "vivo47_responses_local";

async function saveResponse(statusEl){
  try{
    const payload = Object.assign({}, state, { submittedAt: new Date().toISOString() });
    const list = JSON.parse(localStorage.getItem(LOCAL_RESPONSES_KEY)||"[]");
    list.unshift(payload);
    localStorage.setItem(LOCAL_RESPONSES_KEY, JSON.stringify(list.slice(0,200)));
    localStorage.removeItem(STORAGE_KEY);
  }catch(e){}
  statusEl.textContent = "";
  statusEl.className = "status-msg";
}

      '<div class="coach-grid">'+
        '<div class="k">Objetivo</div><div>'+escapeHtml(d.objetivo||"—")+'</div>'+
        '<div class="k">Meta 90 días</div><div>'+escapeHtml(d.meta90||"—")+'</div>'+
        '<div class="k">Entrenamiento</div><div>'+escapeHtml([d.dias,d.horario,d.duracion].filter(Boolean).join(" · ")||"—")+'</div>'+
        '<div class="k">Zonas del cuerpo</div><div>'+escapeHtml(zonasTxt||"—")+'</div>'+
        '<div class="k">Áreas de Center</div><div>'+escapeHtml((d.zonasGym||[]).map(z=>GYM_ZONE_NAMES[z]||z).join(", ")||"—")+'</div>'+
        '<div class="k">Relación con ejercicio</div><div>'+escapeHtml(d.relacion||"—")+'</div>'+
        '<div class="k">Condición física</div><div>'+escapeHtml(d.condicion||"—")+'</div>'+
        '<div class="k">Motivos de abandono</div><div>'+escapeHtml((d.abandono||[]).join(", ")||"—")+'</div>'+
        '<div class="k">Frase de rescate</div><div>'+escapeHtml(d.frase||"—")+'</div>'+
        '<div class="k">Te vemos en Center</div><div>'+escapeHtml(fmtDate(d.diaVemos)||"—")+'</div>'+
      '</div>';
    adminList.appendChild(card);
  });
}

/* ---------------- INIT ---------------- */
renderIntro();

})();
</script>
